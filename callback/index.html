<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threads Trend Watcher 接続中</title>
<style>
body { font-family: "Yu Gothic UI", "Hiragino Sans", sans-serif; font-size: 18px; margin: 40px; line-height: 1.7; }
textarea { width: 100%; height: 6em; font-size: 14px; }
button { font-size: 16px; padding: 8px 20px; margin-top: 8px; }
</style>
</head>
<body>
<p>Threads Trend Watcher に戻っています…</p>
<p>アプリに戻れない場合は、次の URL をコピーしてアプリの [URL を貼り付ける] に貼り付けてください。</p>
<textarea id="u" readonly></textarea><br>
<button onclick="navigator.clipboard.writeText(document.getElementById('u').value)">URL をコピー</button>
<script>
document.getElementById('u').value = location.href;
setTimeout(function () { location.replace('http://127.0.0.1:53682/callback' + location.search); }, 1500);
</script>
</body>
</html>
